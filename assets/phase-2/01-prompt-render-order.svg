<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.40"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0.10"/></linearGradient>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/></marker>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Prompt render order — what becomes cacheable</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">API renders bottom-up: tools → system → messages. Stable content first = larger cache hit.</text>

  <g transform="translate(60, 100)">
    <rect width="500" height="60" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="2"/>
    <rect width="500" height="22" rx="10" fill="url(#hd-purple)"/>
    <rect y="10" width="500" height="12" fill="url(#hd-purple)"/>
    <circle cx="14" cy="11" r="3" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="26" y="15" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.10em">1. TOOLS</text>
    <text x="20" y="46" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">tools=[<tspan fill="#a5f3fc">{name, description, schema}</tspan>, ...]</text>
  </g>

  <g transform="translate(60, 178)">
    <rect width="600" height="60" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="2"/>
    <rect width="600" height="22" rx="10" fill="url(#hd-cyan)"/>
    <rect y="10" width="600" height="12" fill="url(#hd-cyan)"/>
    <circle cx="14" cy="11" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="15" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.10em">2. SYSTEM PROMPT</text>
    <text x="20" y="46" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">system=<tspan fill="#a5f3fc">"You are a helpful assistant..."</tspan></text>
  </g>

  <g transform="translate(60, 256)">
    <rect width="700" height="60" rx="10" fill="#0c1220" stroke="#ec4899" stroke-width="2"/>
    <rect width="700" height="22" rx="10" fill="url(#hd-pink)"/>
    <rect y="10" width="700" height="12" fill="url(#hd-pink)"/>
    <circle cx="14" cy="11" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="15" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.10em">3. MESSAGES (volatile)</text>
    <text x="20" y="46" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">messages=[<tspan fill="#fbcfe8">{role: "user", content: "..."}</tspan>, ...]</text>
  </g>

  <g transform="translate(700, 130)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="14" y="-6" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" letter-spacing="0.08em">CACHE_CONTROL</text>
    <text x="14" y="10" fill="#a5f3fc" font-size="11" font-style="italic">cache breakpoint here =</text>
    <text x="14" y="26" fill="#a5f3fc" font-size="11" font-style="italic">tools + system both cached</text>
  </g>

  <g transform="translate(60, 332)">
    <rect width="800" height="36" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="16" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.10em">RULE</text>
    <text x="60" y="16" fill="#e2e8f0" font-size="11.5">Render order = cache key order.</text>
    <text x="14" y="30" fill="#cbd5e1" font-size="11">Any byte change above the breakpoint invalidates everything below it. Keep volatile content (timestamps, IDs) in messages, never in system.</text>
  </g>

  <text x="440" y="372" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">02 / PROMPTING · RENDER-ORDER</text>
</svg>
