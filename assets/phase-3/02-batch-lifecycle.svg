<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/></marker>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Batch API — async, 50% cheaper</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Up to 100K requests / 256MB. Most batches finish &lt; 1h, max 24h. Results available 29 days.</text>

  <g transform="translate(60, 120)">
    <circle cx="60" cy="60" r="48" fill="#0c1220" stroke="#22d3ee" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="60" y="48" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">CREATE</text>
    <text x="60" y="68" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">in_progress</text>
    <text x="60" y="84" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">queued</text>
  </g>

  <g transform="translate(220, 120)">
    <circle cx="60" cy="60" r="48" fill="#0c1220" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow-amber)"/>
    <text x="60" y="48" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">PROCESSING</text>
    <text x="60" y="68" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">processing</text>
    <text x="60" y="84" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">poll status</text>
    <g transform="translate(60, 102)">
      <circle cx="-8" r="2" fill="#fbbf24"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="2" fill="#fbbf24"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle cx="8" r="2" fill="#fbbf24"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(380, 120)">
    <circle cx="60" cy="60" r="48" fill="#0c1220" stroke="#22c55e" stroke-width="2" filter="url(#glow-green)"/>
    <text x="60" y="48" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">DONE</text>
    <text x="60" y="68" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">ended</text>
    <text x="60" y="84" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">stream results</text>
  </g>

  <line x1="120" y1="180" x2="220" y2="180" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-bright)"/>
  <line x1="280" y1="180" x2="380" y2="180" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-bright)"/>

  <g transform="translate(560, 120)">
    <rect width="260" height="120" rx="14" fill="#0c1220" stroke="#22c55e" stroke-width="1.6"/>
    <text x="14" y="22" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">PER-REQUEST RESULT</text>
    <g transform="translate(14, 36)">
      <rect width="232" height="22" rx="4" fill="#0a2818" stroke="#22c55e" stroke-width="0.7"/>
      <circle cx="10" cy="11" r="3" fill="#22c55e"/>
      <text x="22" y="15" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">succeeded</text>
      <text x="222" y="15" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">.message</text>
    </g>
    <g transform="translate(14, 64)">
      <rect width="232" height="22" rx="4" fill="#2c1410" stroke="#ef4444" stroke-width="0.7"/>
      <circle cx="10" cy="11" r="3" fill="#ef4444"/>
      <text x="22" y="15" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">errored</text>
      <text x="222" y="15" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">.error</text>
    </g>
    <g transform="translate(14, 92)">
      <rect width="232" height="22" rx="4" fill="#1e1a2c" stroke="#a855f7" stroke-width="0.7"/>
      <circle cx="10" cy="11" r="3" fill="#a855f7"/>
      <text x="22" y="15" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">expired</text>
      <text x="222" y="15" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">resubmit</text>
    </g>
  </g>

  <g transform="translate(60, 270)">
    <rect width="320" height="52" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="14" y="22" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">COST</text>
    <text x="14" y="40" fill="#22d3ee" font-size="20" font-weight="700" filter="url(#glow-cyan)">−50%</text>
    <text x="86" y="40" fill="#cbd5e1" font-size="11.5">vs sync Messages API</text>
  </g>

  <g transform="translate(420, 270)">
    <rect width="220" height="52" rx="10" fill="#0c1220" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="14" y="22" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SLA</text>
    <text x="14" y="40" fill="#fbbf24" font-size="13" font-weight="700">&lt; 1h typical · 24h max</text>
  </g>

  <g transform="translate(680, 270)">
    <rect width="180" height="52" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="1.4"/>
    <text x="14" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">RETENTION</text>
    <text x="14" y="40" fill="#a855f7" font-size="13" font-weight="700">29 days</text>
  </g>

  <text x="440" y="368" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">03 / API · BATCH-LIFECYCLE</text>
</svg>
