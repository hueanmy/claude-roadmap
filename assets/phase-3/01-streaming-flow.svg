<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Streaming — Server-Sent Events lifecycle</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Required when max_tokens &gt; 16K. Tokens stream as Claude generates — better UX, no HTTP timeout.</text>

  <g transform="translate(60, 100)">
    <rect width="240" height="220" rx="14" fill="#0c1220" stroke="#22d3ee" stroke-width="2"/>
    <rect width="240" height="36" rx="14" fill="url(#hd-cyan)"/>
    <rect y="22" width="240" height="14" fill="url(#hd-cyan)"/>
    <circle cx="16" cy="18" r="3.5" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="28" y="22" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">YOUR CODE</text>
    <text x="20" y="64" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">with client.messages.</text>
    <text x="20" y="80" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">stream(...) as s:</text>
    <text x="32" y="100" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">for txt in</text>
    <text x="32" y="116" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">s.text_stream:</text>
    <text x="44" y="136" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">print(txt,</text>
    <text x="44" y="152" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">end="", flush=True)</text>
    <line x1="20" y1="172" x2="220" y2="172" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="0.7"/>
    <text x="20" y="192" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">final = s.get_final_</text>
    <text x="20" y="206" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">message()</text>
  </g>

  <g transform="translate(360, 100)">
    <rect width="460" height="220" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2"/>
    <rect width="460" height="36" rx="14" fill="url(#hd-purple)"/>
    <rect y="22" width="460" height="14" fill="url(#hd-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">SSE EVENT STREAM</text>

    <g transform="translate(20, 56)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="420" height="22" rx="4" fill="#1e293b"/>
      <text x="10" y="15" fill="#fbbf24" font-size="10.5" font-weight="600">event:</text>
      <text x="60" y="15" fill="#ffffff" font-size="10.5">message_start</text>
      <text x="410" y="15" text-anchor="end" fill="#64748b" font-size="9.5">id, model, usage</text>
    </g>

    <g transform="translate(20, 84)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="420" height="22" rx="4" fill="#1e293b"/>
      <text x="10" y="15" fill="#fbbf24" font-size="10.5" font-weight="600">event:</text>
      <text x="60" y="15" fill="#ffffff" font-size="10.5">content_block_start</text>
      <text x="410" y="15" text-anchor="end" fill="#64748b" font-size="9.5">type: text</text>
    </g>

    <g transform="translate(20, 112)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="420" height="22" rx="4" fill="#0a1f2e" stroke="#22d3ee" stroke-width="0.7"/>
      <text x="10" y="15" fill="#fbbf24" font-size="10.5" font-weight="600">event:</text>
      <text x="60" y="15" fill="#a5f3fc" font-size="10.5">content_block_delta</text>
      <text x="410" y="15" text-anchor="end" fill="#22d3ee" font-size="9.5" font-weight="600">×N (animated)</text>
    </g>

    <g transform="translate(40, 138)" font-family="ui-monospace, SFMono-Regular, monospace">
      <text x="0" y="13" fill="#94a3b8" font-size="10" opacity="0">"Hi"<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0s" repeatCount="indefinite" fill="freeze"/></text>
      <text x="36" y="13" fill="#94a3b8" font-size="10" opacity="0">"there"<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" repeatCount="indefinite" fill="freeze"/></text>
      <text x="92" y="13" fill="#94a3b8" font-size="10" opacity="0">"! I"<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.8s" repeatCount="indefinite" fill="freeze"/></text>
      <text x="124" y="13" fill="#94a3b8" font-size="10" opacity="0">"'m"<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" repeatCount="indefinite" fill="freeze"/></text>
      <text x="156" y="13" fill="#94a3b8" font-size="10" opacity="0">"Claude..."<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" repeatCount="indefinite" fill="freeze"/></text>
    </g>

    <g transform="translate(20, 158)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="420" height="22" rx="4" fill="#1e293b"/>
      <text x="10" y="15" fill="#fbbf24" font-size="10.5" font-weight="600">event:</text>
      <text x="60" y="15" fill="#ffffff" font-size="10.5">content_block_stop</text>
    </g>

    <g transform="translate(20, 186)" font-family="ui-monospace, SFMono-Regular, monospace">
      <rect width="420" height="22" rx="4" fill="#1e293b"/>
      <text x="10" y="15" fill="#fbbf24" font-size="10.5" font-weight="600">event:</text>
      <text x="60" y="15" fill="#ffffff" font-size="10.5">message_delta</text>
      <text x="410" y="15" text-anchor="end" fill="#64748b" font-size="9.5">stop_reason, usage</text>
    </g>
  </g>

  <g>
    <line x1="300" y1="200" x2="356" y2="200" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="3,3"/>
    <circle r="4" fill="#22d3ee" filter="url(#glow-cyan)">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M300,200 L356,200"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(60, 340)">
    <rect width="800" height="34" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.10em">WHEN TO STREAM</text>
    <text x="160" y="22" fill="#e2e8f0" font-size="11.5">max_tokens &gt; 16K · chat UI · long agent loop · anything user-facing where latency is visible</text>
  </g>

  <text x="440" y="372" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">03 / API · STREAMING-FLOW</text>
</svg>
