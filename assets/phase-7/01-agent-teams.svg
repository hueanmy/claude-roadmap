<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a855f7"/></marker>
  </defs>

  <rect width="880" height="400" fill="#06080d"/>
  <rect width="880" height="400" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Agent Teams — orchestrator + specialists</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Split a 30-tool monolith into orchestrator (5 specialists) + 5 specialists (5-7 tools each). Each layer stays focused.</text>

  <g transform="translate(310, 100)">
    <rect width="260" height="80" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2.5" filter="url(#glow-purple)"/>
    <rect width="260" height="36" rx="14" fill="url(#hd-purple)"/>
    <rect y="22" width="260" height="14" fill="url(#hd-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">ORCHESTRATOR · Opus</text>
    <text x="130" y="60" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Plan · Route · Synthesize</text>
    <text x="130" y="74" text-anchor="middle" fill="#94a3b8" font-size="11">knows about 5 specialists, not 30 tools</text>
  </g>

  <g transform="translate(40, 240)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SPECIALIST</text>
    <text x="80" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Code review</text>
    <text x="80" y="62" text-anchor="middle" fill="#cbd5e1" font-size="10">git_diff, lint, run_tests</text>
    <text x="80" y="78" text-anchor="middle" fill="#cbd5e1" font-size="10">read_file, search</text>
    <text x="80" y="92" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">5 tools · Sonnet</text>
  </g>

  <g transform="translate(212, 240)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#fbbf24" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#fbbf24" filter="url(#glow-amber)"/>
    <text x="26" y="20" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SPECIALIST</text>
    <text x="80" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Billing</text>
    <text x="80" y="62" text-anchor="middle" fill="#cbd5e1" font-size="10">stripe_lookup, refund</text>
    <text x="80" y="78" text-anchor="middle" fill="#cbd5e1" font-size="10">invoice_get, audit_log</text>
    <text x="80" y="92" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">7 tools · Haiku</text>
  </g>

  <g transform="translate(384, 240)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#ec4899" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="20" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SPECIALIST</text>
    <text x="80" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Research</text>
    <text x="80" y="62" text-anchor="middle" fill="#cbd5e1" font-size="10">web_search, fetch</text>
    <text x="80" y="78" text-anchor="middle" fill="#cbd5e1" font-size="10">summarize, cite</text>
    <text x="80" y="92" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">4 tools · Sonnet</text>
  </g>

  <g transform="translate(556, 240)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#22c55e" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#22c55e"/>
    <text x="26" y="20" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SPECIALIST</text>
    <text x="80" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Deploy</text>
    <text x="80" y="62" text-anchor="middle" fill="#cbd5e1" font-size="10">build, ship, rollback</text>
    <text x="80" y="78" text-anchor="middle" fill="#cbd5e1" font-size="10">k8s_apply, log_tail</text>
    <text x="80" y="92" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">6 tools · Sonnet</text>
  </g>

  <g transform="translate(728, 240)">
    <rect width="120" height="100" rx="12" fill="#0c1220" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3,3"/>
    <circle cx="14" cy="16" r="3" fill="#94a3b8"/>
    <text x="26" y="20" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">+N</text>
    <text x="60" y="58" text-anchor="middle" fill="#cbd5e1" font-size="13">add as</text>
    <text x="60" y="74" text-anchor="middle" fill="#cbd5e1" font-size="13">needed</text>
  </g>

  <line x1="380" y1="180" x2="120" y2="240" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-purple)" opacity="0.6"/>
  <line x1="410" y1="180" x2="290" y2="240" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-purple)" opacity="0.6"/>
  <line x1="440" y1="180" x2="464" y2="240" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-purple)" opacity="0.6"/>
  <line x1="470" y1="180" x2="636" y2="240" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-purple)" opacity="0.6"/>
  <line x1="500" y1="180" x2="788" y2="240" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-purple)" opacity="0.6"/>

  <g transform="translate(60, 360)">
    <rect width="800" height="22" rx="6" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="15" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">WHY:</text>
    <text x="60" y="15" fill="#cbd5e1" font-size="10.5">Tool surface stays small per layer · Cost optimized via per-specialist model · Failure isolated · Add new specialists without touching others</text>
  </g>

  <text x="440" y="394" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">07 / ADVANCED · AGENT-TEAMS</text>
</svg>
