<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/></marker>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Evals — golden dataset + LLM judge</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Critical for regression test khi thay model/prompt. "Trust me it works" không scale.</text>

  <g transform="translate(40, 130)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">1. DATASET</text>
    <text x="80" y="50" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Golden cases</text>
    <text x="80" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">50–200 inputs</text>
    <text x="80" y="84" text-anchor="middle" fill="#cbd5e1" font-size="11">+ criteria</text>
    <text x="80" y="98" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">edge cases included</text>
  </g>

  <g transform="translate(232, 130)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#fbbf24" stroke-width="2" filter="url(#glow-amber)"/>
    <circle cx="14" cy="16" r="3" fill="#fbbf24" filter="url(#glow-amber)"/>
    <text x="26" y="20" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">2. UNDER TEST</text>
    <text x="80" y="50" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Run model</text>
    <text x="80" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Haiku 4.5</text>
    <text x="80" y="84" text-anchor="middle" fill="#cbd5e1" font-size="11">+ prompt v2</text>
    <text x="80" y="98" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">collect outputs</text>
  </g>

  <g transform="translate(424, 130)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#a855f7" stroke-width="2.5" filter="url(#glow-purple)"/>
    <circle cx="14" cy="16" r="3" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="26" y="20" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">3. JUDGE</text>
    <text x="80" y="50" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Stronger model</text>
    <text x="80" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Opus 4.7</text>
    <text x="80" y="84" text-anchor="middle" fill="#cbd5e1" font-size="11">grades vs criteria</text>
    <text x="80" y="98" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">{passed, reason}</text>
  </g>

  <g transform="translate(616, 130)">
    <rect width="160" height="100" rx="12" fill="#0c1220" stroke="#ec4899" stroke-width="2"/>
    <circle cx="14" cy="16" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="20" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">4. AGGREGATE</text>
    <text x="80" y="50" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Pass rate</text>
    <text x="80" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">+ p95 latency</text>
    <text x="80" y="84" text-anchor="middle" fill="#cbd5e1" font-size="11">+ cost / case</text>
    <text x="80" y="98" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">vs baseline</text>
  </g>

  <line x1="200" y1="180" x2="232" y2="180" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arr-bright)"/>
  <line x1="392" y1="180" x2="424" y2="180" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arr-bright)"/>
  <line x1="584" y1="180" x2="616" y2="180" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#arr-bright)"/>

  <g transform="translate(40, 270)">
    <rect width="380" height="80" rx="10" fill="#0c1220" stroke="#22c55e" stroke-width="1.4"/>
    <text x="14" y="22" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SAMPLE OUTPUT</text>
    <g transform="translate(14, 32)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">
      <text y="14" fill="#22c55e">[✓]</text>
      <text x="30" y="14" fill="#cbd5e1">17 × 23 → "391"</text>
      <text x="350" y="14" text-anchor="end" fill="#86efac" font-weight="600">PASS</text>
      <text y="32" fill="#22c55e">[✓]</text>
      <text x="30" y="32" fill="#cbd5e1">translate "good morning" → VI</text>
      <text x="350" y="32" text-anchor="end" fill="#86efac" font-weight="600">PASS</text>
      <text y="50" fill="#ef4444">[✗]</text>
      <text x="30" y="50" fill="#cbd5e1">reverse string in 1 line</text>
      <text x="350" y="50" text-anchor="end" fill="#fca5a5" font-weight="600">FAIL</text>
    </g>
  </g>

  <g transform="translate(450, 270)">
    <rect width="390" height="80" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="1.4"/>
    <text x="14" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SCORECARD</text>
    <g transform="translate(14, 36)">
      <text y="14" fill="#cbd5e1" font-size="11.5">Pass rate</text>
      <text x="370" y="14" text-anchor="end" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700">87%</text>
      <text y="32" fill="#cbd5e1" font-size="11.5">p95 latency</text>
      <text x="370" y="32" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">2.3 s</text>
      <text y="46" fill="#cbd5e1" font-size="11.5">Cost / 100 cases</text>
      <text x="370" y="46" text-anchor="end" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">$0.42</text>
    </g>
  </g>

  <text x="440" y="372" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">07 / ADVANCED · EVALS-PIPELINE</text>
</svg>
