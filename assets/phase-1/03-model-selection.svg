<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="header-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="header-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="header-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="880" height="360" fill="#06080d"/>
  <rect width="880" height="360" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Routing — chọn Claude model nào theo task</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Escalate up the ladder only when task complexity demands it. Most production traffic = Sonnet.</text>

  <g transform="translate(40, 100)">
    <rect width="240" height="180" rx="14" fill="#0c1220" stroke="#ec4899" stroke-width="2" filter="url(#glow-pink)"/>
    <rect width="240" height="180" rx="14" fill="#0c1220"/>
    <rect width="240" height="180" rx="14" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect width="240" height="36" rx="14" fill="url(#header-pink)"/>
    <rect y="22" width="240" height="14" fill="url(#header-pink)"/>
    <circle cx="16" cy="18" r="3.5" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="28" y="22" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">FAST · CHEAP</text>
    <text x="120" y="74" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Haiku 4.5</text>
    <text x="120" y="96" text-anchor="middle" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">$1 / $5 per 1M</text>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#ec4899" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="20" y="130" fill="#e2e8f0" font-size="12">→ Classify, extract, format</text>
    <text x="20" y="148" fill="#e2e8f0" font-size="12">→ Subagent for sub-tasks</text>
    <text x="20" y="166" fill="#e2e8f0" font-size="12">→ Latency-sensitive UI</text>
  </g>

  <g transform="translate(320, 100)">
    <rect width="240" height="180" rx="14" fill="#0c1220" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow-cyan)"/>
    <rect width="240" height="180" rx="14" fill="#0c1220"/>
    <rect width="240" height="180" rx="14" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <rect width="240" height="36" rx="14" fill="url(#header-cyan)"/>
    <rect y="22" width="240" height="14" fill="url(#header-cyan)"/>
    <circle cx="16" cy="18" r="3.5" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="28" y="22" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">BALANCED · DEFAULT</text>
    <text x="120" y="74" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Sonnet 4.6</text>
    <text x="120" y="96" text-anchor="middle" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">$3 / $15 per 1M</text>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="20" y="130" fill="#e2e8f0" font-size="12">→ Production chatbot</text>
    <text x="20" y="148" fill="#e2e8f0" font-size="12">→ Long-form writing</text>
    <text x="20" y="166" fill="#e2e8f0" font-size="12">→ Computer-use agent</text>
  </g>

  <g transform="translate(600, 100)">
    <rect width="240" height="180" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2" filter="url(#glow-purple)"/>
    <rect width="240" height="180" rx="14" fill="#0c1220"/>
    <rect width="240" height="180" rx="14" fill="none" stroke="#a855f7" stroke-width="2"/>
    <rect width="240" height="36" rx="14" fill="url(#header-purple)"/>
    <rect y="22" width="240" height="14" fill="url(#header-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">MOST CAPABLE</text>
    <text x="120" y="74" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Opus 4.7</text>
    <text x="120" y="96" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">$5 / $25 per 1M</text>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#a855f7" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="20" y="130" fill="#e2e8f0" font-size="12">→ Complex coding agent</text>
    <text x="20" y="148" fill="#e2e8f0" font-size="12">→ Multi-step reasoning</text>
    <text x="20" y="166" fill="#e2e8f0" font-size="12">→ Long-horizon agentic</text>
  </g>

  <path d="M280,180 L320,180" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-bright)" fill="none"/>
  <text x="300" y="170" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="500" font-style="italic">escalate</text>
  <path d="M560,180 L600,180" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-bright)" fill="none"/>
  <text x="580" y="170" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="500" font-style="italic">escalate</text>

  <g transform="translate(40, 296)">
    <rect width="800" height="38" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="18" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.10em">RULE OF THUMB</text>
    <text x="14" y="32" fill="#e2e8f0" font-size="11.5">Default to <tspan fill="#22d3ee" font-weight="700">Sonnet</tspan>. Drop to <tspan fill="#ec4899" font-weight="700">Haiku</tspan> when accuracy on simple tasks holds. Promote to <tspan fill="#a855f7" font-weight="700">Opus</tspan> only when measurable wins justify the 5× cost.</text>
  </g>

  <text x="440" y="350" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">
    01 / FOUNDATION · MODEL-SELECTION
  </text>
</svg>
