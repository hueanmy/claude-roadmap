<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.25"/>
    </pattern>
    <linearGradient id="bg-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="880" height="360" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#e6edf3" font-size="14" font-weight="600">Routing — chọn Claude model nào theo task</text>
  <text x="60" y="62" fill="#64748b" font-size="11" font-style="italic">Escalate up the ladder only when task complexity demands it. Most production traffic = Sonnet.</text>

  <g transform="translate(40, 100)">
    <rect width="240" height="180" rx="14" fill="url(#bg-pink)" stroke="#f472b6" stroke-width="1.2"/>
    <rect width="240" height="32" rx="14" fill="#f472b6" fill-opacity="0.08"/>
    <rect y="20" width="240" height="12" fill="#f472b6" fill-opacity="0.08"/>
    <circle cx="16" cy="16" r="3.5" fill="#f472b6" opacity="0.7"/>
    <text x="28" y="20" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">FAST · CHEAP</text>
    <text x="120" y="64" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Haiku 4.5</text>
    <text x="120" y="86" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">$1 / $5 per 1M</text>
    <line x1="20" y1="100" x2="220" y2="100" stroke="#f472b6" stroke-opacity="0.2" stroke-width="0.7"/>
    <text x="20" y="120" fill="#cbd5e1" font-size="11.5">→ Classify, extract, format</text>
    <text x="20" y="138" fill="#cbd5e1" font-size="11.5">→ Subagent for sub-tasks</text>
    <text x="20" y="156" fill="#cbd5e1" font-size="11.5">→ Latency-sensitive UI</text>
    <text x="20" y="170" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-style="italic">200K context</text>
  </g>

  <g transform="translate(320, 100)">
    <rect width="240" height="180" rx="14" fill="url(#bg-cyan)" stroke="#5eead4" stroke-width="1.4"/>
    <rect width="240" height="32" rx="14" fill="#5eead4" fill-opacity="0.10"/>
    <rect y="20" width="240" height="12" fill="#5eead4" fill-opacity="0.10"/>
    <circle cx="16" cy="16" r="3.5" fill="#5eead4" opacity="0.85"/>
    <text x="28" y="20" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">BALANCED · DEFAULT</text>
    <text x="120" y="64" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Sonnet 4.6</text>
    <text x="120" y="86" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">$3 / $15 per 1M</text>
    <line x1="20" y1="100" x2="220" y2="100" stroke="#5eead4" stroke-opacity="0.25" stroke-width="0.7"/>
    <text x="20" y="120" fill="#cbd5e1" font-size="11.5">→ Production chatbot</text>
    <text x="20" y="138" fill="#cbd5e1" font-size="11.5">→ Long-form writing</text>
    <text x="20" y="156" fill="#cbd5e1" font-size="11.5">→ Computer-use agent</text>
    <text x="20" y="170" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-style="italic">1M context · 64K out</text>
  </g>

  <g transform="translate(600, 100)">
    <rect width="240" height="180" rx="14" fill="url(#bg-purple)" stroke="#a78bfa" stroke-width="1.4"/>
    <rect width="240" height="32" rx="14" fill="#a78bfa" fill-opacity="0.10"/>
    <rect y="20" width="240" height="12" fill="#a78bfa" fill-opacity="0.10"/>
    <circle cx="16" cy="16" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <text x="28" y="20" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">MOST CAPABLE</text>
    <text x="120" y="64" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Opus 4.7</text>
    <text x="120" y="86" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">$5 / $25 per 1M</text>
    <line x1="20" y1="100" x2="220" y2="100" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="0.7"/>
    <text x="20" y="120" fill="#cbd5e1" font-size="11.5">→ Complex coding agent</text>
    <text x="20" y="138" fill="#cbd5e1" font-size="11.5">→ Multi-step reasoning</text>
    <text x="20" y="156" fill="#cbd5e1" font-size="11.5">→ Long-horizon agentic</text>
    <text x="20" y="170" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-style="italic">1M context · adaptive</text>
  </g>

  <path d="M280,170 L320,170" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-gray)" fill="none" opacity="0.6"/>
  <text x="300" y="158" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">escalate</text>
  <path d="M560,170 L600,170" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-gray)" fill="none" opacity="0.6"/>
  <text x="580" y="158" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">escalate</text>

  <g transform="translate(60, 310)">
    <text x="0" y="0" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" letter-spacing="0.08em">RULE OF THUMB</text>
    <text x="0" y="18" fill="#cbd5e1" font-size="11.5">Default to <tspan fill="#5eead4" font-weight="600">Sonnet</tspan>. Drop to <tspan fill="#f472b6" font-weight="600">Haiku</tspan> when accuracy on simple tasks holds. Promote to <tspan fill="#a78bfa" font-weight="600">Opus</tspan> only when measurable wins justify the 5× cost.</text>
  </g>

  <text x="440" y="346" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.05em">
    01 / FOUNDATION · model-selection
  </text>
</svg>
