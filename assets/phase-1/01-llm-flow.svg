<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="880" height="320" fill="url(#dotgrid)"/>

  <g transform="translate(36, 60)">
    <rect width="244" height="180" rx="14" fill="url(#bg-cyan)" stroke="#5eead4" stroke-width="1.2"/>
    <rect width="244" height="32" rx="14" fill="#5eead4" fill-opacity="0.08"/>
    <rect y="20" width="244" height="12" fill="#5eead4" fill-opacity="0.08"/>
    <circle cx="16" cy="16" r="3.5" fill="#5eead4" opacity="0.7"/>
    <text x="28" y="20" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">YOUR&#160;CODE</text>
    <text x="16" y="60" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">client.messages.create(</text>
    <text x="16" y="78" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">&#160;&#160;model=</text>
    <text x="73" y="78" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">"claude-opus-4-7"</text>
    <text x="195" y="78" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">,</text>
    <text x="16" y="96" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">&#160;&#160;max_tokens=</text>
    <text x="98" y="96" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">1024</text>
    <text x="125" y="96" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">,</text>
    <text x="16" y="114" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">&#160;&#160;messages=[{</text>
    <text x="16" y="132" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">&#160;&#160;&#160;&#160;</text>
    <text x="40" y="132" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">"role"</text>
    <text x="83" y="132" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">:&#160;</text>
    <text x="93" y="132" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">"user"</text>
    <text x="135" y="132" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">,</text>
    <text x="16" y="150" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">&#160;&#160;&#160;&#160;</text>
    <text x="40" y="150" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">"content"</text>
    <text x="105" y="150" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">:&#160;</text>
    <text x="115" y="150" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">"Hi"</text>
    <text x="143" y="150" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">}],</text>
    <text x="16" y="168" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">)</text>
  </g>

  <g>
    <line x1="290" y1="150" x2="372" y2="150" stroke="#5eead4" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="2,4"/>
    <circle r="4" fill="#5eead4" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M290,150 L372,150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="331" y="138" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-style="italic">request</text>
  </g>

  <g transform="translate(380, 60)">
    <rect width="120" height="180" rx="14" fill="url(#bg-purple)" stroke="#a78bfa" stroke-width="1.2" filter="url(#glow)"/>
    <rect width="120" height="32" rx="14" fill="#a78bfa" fill-opacity="0.08"/>
    <rect y="20" width="120" height="12" fill="#a78bfa" fill-opacity="0.08"/>
    <circle cx="16" cy="16" r="3.5" fill="#a78bfa" opacity="0.7"/>
    <text x="28" y="20" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">CLAUDE</text>
    <text x="60" y="80" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Opus 4.7</text>
    <text x="60" y="100" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-style="italic">next-token loop</text>
    <g transform="translate(60, 130)">
      <circle cx="-12" r="2.5" fill="#a78bfa">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#a78bfa">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" r="2.5" fill="#a78bfa">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="60" y="158" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">thinking…</text>
  </g>

  <g>
    <line x1="510" y1="150" x2="592" y2="150" stroke="#f472b6" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="2,4"/>
    <circle r="4" fill="#f472b6" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M510,150 L592,150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="551" y="138" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-style="italic">stream</text>
  </g>

  <g transform="translate(600, 60)">
    <rect width="244" height="180" rx="14" fill="url(#bg-pink)" stroke="#f472b6" stroke-width="1.2"/>
    <rect width="244" height="32" rx="14" fill="#f472b6" fill-opacity="0.08"/>
    <rect y="20" width="244" height="12" fill="#f472b6" fill-opacity="0.08"/>
    <circle cx="16" cy="16" r="3.5" fill="#f472b6" opacity="0.7"/>
    <text x="28" y="20" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" letter-spacing="0.08em">TOKEN&#160;STREAM</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#e6edf3">
      <text x="16" y="62" opacity="0">Hello<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0s" fill="freeze"/></text>
      <text x="62" y="62" opacity="0" fill="#94a3b8">!<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.25s" fill="freeze"/></text>
      <text x="16" y="84" opacity="0">I'm<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.55s" fill="freeze"/></text>
      <text x="44" y="84" opacity="0">Claude<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.85s" fill="freeze"/></text>
      <text x="92" y="84" opacity="0" fill="#94a3b8">,<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.15s" fill="freeze"/></text>
      <text x="16" y="106" opacity="0">an<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.45s" fill="freeze"/></text>
      <text x="36" y="106" opacity="0">AI<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.75s" fill="freeze"/></text>
      <text x="56" y="106" opacity="0">assistant<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.05s" fill="freeze"/></text>
      <text x="124" y="106" opacity="0" fill="#94a3b8">.<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.35s" fill="freeze"/></text>
    </g>
    <text x="16" y="138" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" opacity="0.85">▌
      <animate attributeName="opacity" values="0;0.85;0" dur="1s" repeatCount="indefinite"/>
    </text>
    <line x1="16" y1="152" x2="228" y2="152" stroke="#f472b6" stroke-width="0.7" stroke-opacity="0.2"/>
    <text x="16" y="168" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">stop_reason: end_turn</text>
  </g>

  <text x="440" y="280" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">
    Stateless — every request resends the full conversation history.
  </text>
  <text x="440" y="296" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.05em">
    01 / FOUNDATION · how-llms-work
  </text>
</svg>
