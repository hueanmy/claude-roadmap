<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="header-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="header-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="header-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="880" height="320" fill="#06080d"/>
  <rect width="880" height="320" fill="url(#dotgrid)"/>

  <g transform="translate(36, 60)">
    <rect width="244" height="180" rx="14" fill="#0c1220" stroke="#22d3ee" stroke-width="2"/>
    <rect width="244" height="36" rx="14" fill="url(#header-cyan)"/>
    <rect y="22" width="244" height="14" fill="url(#header-cyan)"/>
    <circle cx="16" cy="18" r="3.5" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="28" y="22" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">YOUR&#160;CODE</text>
    <text x="16" y="64" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">client.messages.create(</text>
    <text x="16" y="84" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">&#160;&#160;model=</text>
    <text x="78" y="84" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">"claude-opus-4-7"</text>
    <text x="206" y="84" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">,</text>
    <text x="16" y="104" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">&#160;&#160;max_tokens=</text>
    <text x="103" y="104" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">1024</text>
    <text x="135" y="104" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">,</text>
    <text x="16" y="124" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">&#160;&#160;messages=[{</text>
    <text x="40" y="144" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">"role"</text>
    <text x="86" y="144" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">:&#160;</text>
    <text x="98" y="144" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">"user"</text>
    <text x="142" y="144" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">,</text>
    <text x="40" y="164" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">"content"</text>
    <text x="110" y="164" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">:&#160;</text>
    <text x="122" y="164" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">"Hi"</text>
    <text x="152" y="164" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">}],</text>
  </g>

  <g>
    <line x1="290" y1="150" x2="372" y2="150" stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.4" stroke-dasharray="2,4"/>
    <circle r="5" fill="#22d3ee" filter="url(#glow-cyan)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M290,150 L372,150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="331" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">request</text>
  </g>

  <g transform="translate(380, 60)">
    <rect width="120" height="180" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2.5" filter="url(#glow-purple)"/>
    <rect width="120" height="180" rx="14" fill="#0c1220"/>
    <rect width="120" height="180" rx="14" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <rect width="120" height="36" rx="14" fill="url(#header-purple)"/>
    <rect y="22" width="120" height="14" fill="url(#header-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">CLAUDE</text>
    <text x="60" y="80" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Opus 4.7</text>
    <text x="60" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">next-token loop</text>
    <g transform="translate(60, 132)">
      <circle cx="-14" r="3" fill="#a855f7" filter="url(#glow-purple)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#a855f7" filter="url(#glow-purple)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" r="3" fill="#a855f7" filter="url(#glow-purple)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="60" y="160" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">thinking…</text>
  </g>

  <g>
    <line x1="510" y1="150" x2="592" y2="150" stroke="#ec4899" stroke-width="1.6" stroke-opacity="0.4" stroke-dasharray="2,4"/>
    <circle r="5" fill="#ec4899" filter="url(#glow-pink)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M510,150 L592,150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="551" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">stream</text>
  </g>

  <g transform="translate(600, 60)">
    <rect width="244" height="180" rx="14" fill="#0c1220" stroke="#ec4899" stroke-width="2"/>
    <rect width="244" height="36" rx="14" fill="url(#header-pink)"/>
    <rect y="22" width="244" height="14" fill="url(#header-pink)"/>
    <circle cx="16" cy="18" r="3.5" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="28" y="22" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">TOKEN&#160;STREAM</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#ffffff" font-weight="500">
      <text x="16" y="66" opacity="0">Hello<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0s" fill="freeze"/></text>
      <text x="64" y="66" opacity="0" fill="#94a3b8">!<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.25s" fill="freeze"/></text>
      <text x="16" y="88" opacity="0">I'm<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.55s" fill="freeze"/></text>
      <text x="48" y="88" opacity="0">Claude<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.85s" fill="freeze"/></text>
      <text x="100" y="88" opacity="0" fill="#94a3b8">,<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.15s" fill="freeze"/></text>
      <text x="16" y="110" opacity="0">an<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.45s" fill="freeze"/></text>
      <text x="38" y="110" opacity="0">AI<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.75s" fill="freeze"/></text>
      <text x="60" y="110" opacity="0">assistant<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.05s" fill="freeze"/></text>
      <text x="132" y="110" opacity="0" fill="#94a3b8">.<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.35s" fill="freeze"/></text>
    </g>
    <text x="16" y="142" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" filter="url(#glow-cyan)">▌
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </text>
    <line x1="16" y1="156" x2="228" y2="156" stroke="#ec4899" stroke-width="0.7" stroke-opacity="0.25"/>
    <text x="16" y="172" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">stop_reason: end_turn</text>
  </g>

  <text x="440" y="282" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-style="italic">
    Stateless — every request resends the full conversation history.
  </text>
  <text x="440" y="300" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">
    01 / FOUNDATION · HOW-LLMS-WORK
  </text>
</svg>
