<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Context window — typical 1M-token allocation</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Opus 4.7 / Sonnet 4.6 — total budget renders in this order: tools → system → messages</text>

  <g transform="translate(60, 110)">
    <text x="0" y="0" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">System prompt</text>
    <text x="760" y="0" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">~2K</text>
    <rect x="0" y="8" width="760" height="8" rx="4" fill="#0c1220" stroke="#1e293b" stroke-width="0.7"/>
    <rect x="0" y="8" width="2" height="8" rx="4" fill="#22d3ee" filter="url(#glow-cyan)"/>

    <text x="0" y="40" fill="#a855f7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">Tools</text>
    <text x="760" y="40" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">~1K</text>
    <rect x="0" y="48" width="760" height="8" rx="4" fill="#0c1220" stroke="#1e293b" stroke-width="0.7"/>
    <rect x="0" y="48" width="1" height="8" rx="4" fill="#a855f7" filter="url(#glow-purple)"/>

    <text x="0" y="80" fill="#3b82f6" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">Conversation history</text>
    <text x="760" y="80" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">~500K</text>
    <rect x="0" y="88" width="760" height="8" rx="4" fill="#0c1220" stroke="#1e293b" stroke-width="0.7"/>
    <rect x="0" y="88" width="380" height="8" rx="4" fill="#3b82f6" filter="url(#glow-blue)"/>

    <text x="0" y="120" fill="#ec4899" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">Reserved for output</text>
    <text x="760" y="120" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">~64K</text>
    <rect x="0" y="128" width="760" height="8" rx="4" fill="#0c1220" stroke="#1e293b" stroke-width="0.7"/>
    <rect x="0" y="128" width="48" height="8" rx="4" fill="#ec4899" filter="url(#glow-pink)"/>

    <text x="0" y="160" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">Free space</text>
    <text x="760" y="160" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">~433K</text>
    <rect x="0" y="168" width="760" height="8" rx="4" fill="#0c1220" stroke="#1e293b" stroke-width="0.7"/>
    <rect x="0" y="168" width="330" height="8" rx="4" fill="#475569"/>
  </g>

  <g transform="translate(60, 308)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-10" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">0</text>
    <text x="190" y="-10" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">250K</text>
    <text x="380" y="-10" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">500K</text>
    <text x="570" y="-10" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">750K</text>
    <text x="760" y="-10" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">1M</text>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#475569" stroke-width="1.2"/>
    <line x1="190" y1="-3" x2="190" y2="3" stroke="#475569" stroke-width="1.2"/>
    <line x1="380" y1="-3" x2="380" y2="3" stroke="#475569" stroke-width="1.2"/>
    <line x1="570" y1="-3" x2="570" y2="3" stroke="#475569" stroke-width="1.2"/>
    <line x1="760" y1="-3" x2="760" y2="3" stroke="#475569" stroke-width="1.2"/>
  </g>

  <g transform="translate(40, 326)">
    <rect width="800" height="40" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="18" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.10em">PER-MODEL CONTEXT</text>
    <text x="14" y="32" fill="#22d3ee" font-size="11.5" font-weight="700">Opus 4.7</text>
    <text x="80" y="32" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">1,000,000</text>
    <text x="200" y="32" fill="#3b82f6" font-size="11.5" font-weight="700">Sonnet 4.6</text>
    <text x="282" y="32" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">1,000,000</text>
    <text x="400" y="32" fill="#ec4899" font-size="11.5" font-weight="700">Haiku 4.5</text>
    <text x="476" y="32" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">200,000</text>
    <text x="786" y="32" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" letter-spacing="0.08em">tokens</text>
  </g>

  <text x="440" y="372" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">
    01 / FOUNDATION · CONTEXT-WINDOW
  </text>
</svg>
