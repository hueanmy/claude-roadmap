<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="880" height="360" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#e6edf3" font-size="14" font-weight="600">Context window — typical 1M-token allocation</text>
  <text x="60" y="62" fill="#64748b" font-size="11" font-style="italic">Opus 4.7 / Sonnet 4.6 — total budget renders in this order: tools → system → messages</text>

  <g transform="translate(60, 100)">
    <text x="0" y="0" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">System prompt</text>
    <text x="760" y="0" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">~2K</text>
    <rect x="0" y="8" width="760" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="8" width="1.5" height="6" rx="3" fill="#5eead4" filter="url(#glow)"/>

    <text x="0" y="36" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Tools</text>
    <text x="760" y="36" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">~1K</text>
    <rect x="0" y="44" width="760" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="44" width="0.8" height="6" rx="3" fill="#a78bfa" filter="url(#glow)"/>

    <text x="0" y="72" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Conversation history</text>
    <text x="760" y="72" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">~500K</text>
    <rect x="0" y="80" width="760" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="80" width="380" height="6" rx="3" fill="#7dd3fc"/>

    <text x="0" y="108" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Reserved for output</text>
    <text x="760" y="108" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">~64K</text>
    <rect x="0" y="116" width="760" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="116" width="48" height="6" rx="3" fill="#f472b6"/>

    <text x="0" y="144" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Free space</text>
    <text x="760" y="144" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">~433K</text>
    <rect x="0" y="152" width="760" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="152" width="330" height="6" rx="3" fill="#475569"/>
  </g>

  <g transform="translate(60, 280)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="-10" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">0</text>
    <text x="190" y="-10" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">250K</text>
    <text x="380" y="-10" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">500K</text>
    <text x="570" y="-10" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">750K</text>
    <text x="760" y="-10" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">1M</text>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#475569"/>
    <line x1="190" y1="-2" x2="190" y2="2" stroke="#475569"/>
    <line x1="380" y1="-2" x2="380" y2="2" stroke="#475569"/>
    <line x1="570" y1="-2" x2="570" y2="2" stroke="#475569"/>
    <line x1="760" y1="-2" x2="760" y2="2" stroke="#475569"/>
  </g>

  <g transform="translate(60, 310)">
    <text x="0" y="0" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.08em">PER MODEL</text>
    <text x="0" y="20" fill="#5eead4" font-size="12" font-weight="600">Opus 4.7</text>
    <text x="180" y="20" text-anchor="end" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">1,000,000 tok</text>
    <text x="260" y="20" fill="#7dd3fc" font-size="12" font-weight="600">Sonnet 4.6</text>
    <text x="440" y="20" text-anchor="end" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">1,000,000 tok</text>
    <text x="520" y="20" fill="#f472b6" font-size="12" font-weight="600">Haiku 4.5</text>
    <text x="700" y="20" text-anchor="end" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">200,000 tok</text>
  </g>

  <text x="440" y="346" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.05em">
    01 / FOUNDATION · context-window
  </text>
</svg>
