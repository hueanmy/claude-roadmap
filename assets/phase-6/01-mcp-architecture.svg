<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
  </defs>

  <rect width="880" height="420" fill="#06080d"/>
  <rect width="880" height="420" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Model Context Protocol — universal client ↔ server</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Open standard. Write 1 server → works with Claude Code, Claude Desktop, Cursor, Zed. JSON-RPC over stdio/HTTP.</text>

  <text x="60" y="104" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.10em">MCP CLIENTS</text>

  <g transform="translate(60, 116)">
    <rect width="170" height="60" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">CLIENT</text>
    <text x="14" y="42" fill="#ffffff" font-size="13" font-weight="600">Claude Code</text>
    <text x="14" y="54" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">.mcp.json</text>
  </g>

  <g transform="translate(245, 116)">
    <rect width="170" height="60" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">CLIENT</text>
    <text x="14" y="42" fill="#ffffff" font-size="13" font-weight="600">Claude Desktop</text>
    <text x="14" y="54" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">claude_desktop_config</text>
  </g>

  <g transform="translate(430, 116)">
    <rect width="170" height="60" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">CLIENT</text>
    <text x="14" y="42" fill="#ffffff" font-size="13" font-weight="600">Cursor / Zed</text>
    <text x="14" y="54" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">.cursor/mcp.json</text>
  </g>

  <g transform="translate(615, 116)">
    <rect width="200" height="60" rx="10" fill="#0c1220" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="3,3"/>
    <circle cx="14" cy="16" r="3" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="26" y="20" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.08em">YOUR CUSTOM CLIENT</text>
    <text x="14" y="42" fill="#cbd5e1" font-size="13" font-weight="500">embed Claude in your app</text>
    <text x="14" y="54" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">SDK + MCP impl</text>
  </g>

  <g transform="translate(60, 196)">
    <rect width="755" height="40" rx="8" fill="#0c1220" stroke="#fbbf24" stroke-width="1.4" filter="url(#glow-amber)"/>
    <text x="14" y="24" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">JSON-RPC 2.0</text>
    <text x="160" y="24" fill="#cbd5e1" font-size="11.5">tools/list · tools/call · resources/list · resources/read · prompts/list · prompts/get · initialize · ping</text>
  </g>

  <text x="60" y="264" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="0.10em">MCP SERVERS</text>

  <g transform="translate(60, 276)">
    <rect width="170" height="100" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="1.6"/>
    <rect width="170" height="22" rx="10" fill="url(#hd-purple)"/>
    <rect y="12" width="170" height="10" fill="url(#hd-purple)"/>
    <circle cx="14" cy="11" r="3" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="26" y="15" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em">SERVER</text>
    <text x="14" y="40" fill="#ffffff" font-size="13" font-weight="600">filesystem</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="11">read · write · list</text>
    <text x="14" y="74" fill="#94a3b8" font-size="10">official mcp-fs</text>
    <text x="14" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">stdio · local</text>
  </g>

  <g transform="translate(245, 276)">
    <rect width="170" height="100" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="1.6"/>
    <rect width="170" height="22" rx="10" fill="url(#hd-purple)"/>
    <rect y="12" width="170" height="10" fill="url(#hd-purple)"/>
    <circle cx="14" cy="11" r="3" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="26" y="15" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em">SERVER</text>
    <text x="14" y="40" fill="#ffffff" font-size="13" font-weight="600">github</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="11">issues · PRs · search</text>
    <text x="14" y="74" fill="#94a3b8" font-size="10">api.githubcopilot.com</text>
    <text x="14" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">HTTP · OAuth</text>
  </g>

  <g transform="translate(430, 276)">
    <rect width="170" height="100" rx="10" fill="#0c1220" stroke="#a855f7" stroke-width="1.6"/>
    <rect width="170" height="22" rx="10" fill="url(#hd-purple)"/>
    <rect y="12" width="170" height="10" fill="url(#hd-purple)"/>
    <circle cx="14" cy="11" r="3" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="26" y="15" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em">SERVER</text>
    <text x="14" y="40" fill="#ffffff" font-size="13" font-weight="600">postgres</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="11">query · schema</text>
    <text x="14" y="74" fill="#94a3b8" font-size="10">mcp-postgres</text>
    <text x="14" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">stdio · DB_URL env</text>
  </g>

  <g transform="translate(615, 276)">
    <rect width="200" height="100" rx="10" fill="#0c1220" stroke="#ec4899" stroke-width="2" filter="url(#glow-pink)"/>
    <rect width="200" height="22" rx="10" fill="#ec4899" fill-opacity="0.18"/>
    <rect y="12" width="200" height="10" fill="#ec4899" fill-opacity="0.18"/>
    <circle cx="14" cy="11" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="15" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em">YOUR CUSTOM SERVER</text>
    <text x="14" y="40" fill="#ffffff" font-size="13" font-weight="600">internal-tools</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="11">deploy · monitor · ops</text>
    <text x="14" y="74" fill="#94a3b8" font-size="10">FastMCP, ~30 lines</text>
    <text x="14" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">stdio · subprocess</text>
  </g>

  <g>
    <line x1="145" y1="180" x2="145" y2="272" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="0.7"/>
    <line x1="330" y1="180" x2="330" y2="272" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="0.7"/>
    <line x1="515" y1="180" x2="515" y2="272" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="0.7"/>
    <line x1="715" y1="180" x2="715" y2="272" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="0.7"/>
  </g>

  <text x="440" y="412" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">06 / MCP · ARCHITECTURE</text>
</svg>
