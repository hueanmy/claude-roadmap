<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Transports — stdio vs Streamable HTTP</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Same protocol, different wire. Stdio for local tools; HTTP for shared/remote services.</text>

  <g transform="translate(60, 100)">
    <rect width="380" height="240" rx="14" fill="#0c1220" stroke="#22d3ee" stroke-width="2"/>
    <rect width="380" height="36" rx="14" fill="url(#hd-cyan)"/>
    <rect y="22" width="380" height="14" fill="url(#hd-cyan)"/>
    <circle cx="16" cy="18" r="3.5" fill="#22d3ee" filter="url(#glow-cyan)"/>
    <text x="28" y="22" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">STDIO</text>
    <text x="360" y="22" text-anchor="end" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">subprocess · local</text>

    <text x="20" y="64" fill="#ffffff" font-size="13" font-weight="600">Client spawns server as subprocess</text>
    <text x="20" y="84" fill="#cbd5e1" font-size="11">Communicate via stdin / stdout (JSON-RPC frames)</text>

    <line x1="20" y1="104" x2="360" y2="104" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="0.7"/>

    <text x="20" y="130" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600">Use for:</text>
    <text x="20" y="148" fill="#cbd5e1" font-size="11.5">→ Filesystem access, git, local DB</text>
    <text x="20" y="166" fill="#cbd5e1" font-size="11.5">→ Tools needing no auth (or env vars)</text>
    <text x="20" y="184" fill="#cbd5e1" font-size="11.5">→ Personal dev workflow</text>

    <line x1="20" y1="200" x2="360" y2="200" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="0.7"/>
    <text x="20" y="222" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">{"command": "uv", "args": [...]}</text>
  </g>

  <g transform="translate(480, 100)">
    <rect width="340" height="240" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2"/>
    <rect width="340" height="36" rx="14" fill="url(#hd-purple)"/>
    <rect y="22" width="340" height="14" fill="url(#hd-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">STREAMABLE HTTP</text>
    <text x="320" y="22" text-anchor="end" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">remote · SSE</text>

    <text x="20" y="64" fill="#ffffff" font-size="13" font-weight="600">Server runs as long-lived service</text>
    <text x="20" y="84" fill="#cbd5e1" font-size="11">Client connects via HTTPS with streaming response</text>

    <line x1="20" y1="104" x2="320" y2="104" stroke="#a855f7" stroke-opacity="0.25" stroke-width="0.7"/>

    <text x="20" y="130" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600">Use for:</text>
    <text x="20" y="148" fill="#cbd5e1" font-size="11.5">→ Cloud SaaS (Linear, Atlassian)</text>
    <text x="20" y="166" fill="#cbd5e1" font-size="11.5">→ Team-wide internal API</text>
    <text x="20" y="184" fill="#cbd5e1" font-size="11.5">→ OAuth-authed services</text>

    <line x1="20" y1="200" x2="320" y2="200" stroke="#a855f7" stroke-opacity="0.25" stroke-width="0.7"/>
    <text x="20" y="222" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">{"url": "https://...", "headers": {...}}</text>
  </g>

  <g transform="translate(60, 360)">
    <text x="0" y="0" text-anchor="start" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">06 / MCP · TRANSPORTS</text>
  </g>

  <text x="780" y="368" text-anchor="end" fill="#94a3b8" font-size="10.5" font-style="italic">
    Hybrid OK: 1 client connects both stdio (local fs) + HTTP (cloud APIs).
  </text>
</svg>
