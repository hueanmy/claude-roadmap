<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#475569" opacity="0.35"/>
    </pattern>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hd-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.40"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hd-pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.40"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0.10"/></linearGradient>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a855f7"/></marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ec4899"/></marker>
  </defs>

  <rect width="880" height="380" fill="#06080d"/>
  <rect width="880" height="380" fill="url(#dotgrid)"/>

  <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="700">Subagent — delegate sub-tasks, save main context</text>
  <text x="60" y="64" fill="#94a3b8" font-size="11.5" font-style="italic">Main agent (Opus) spawns smaller agent (Haiku) for narrow task. Sub returns summary, not raw context.</text>

  <g transform="translate(280, 100)">
    <rect width="320" height="100" rx="14" fill="#0c1220" stroke="#a855f7" stroke-width="2.5" filter="url(#glow-purple)"/>
    <rect width="320" height="36" rx="14" fill="url(#hd-purple)"/>
    <rect y="22" width="320" height="14" fill="url(#hd-purple)"/>
    <circle cx="16" cy="18" r="3.5" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="28" y="22" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="0.10em">MAIN AGENT</text>
    <text x="280" y="22" text-anchor="end" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">Opus 4.7</text>
    <text x="160" y="60" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Build feature X</text>
    <text x="160" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">Holds primary context: codebase map, design decisions, user goals</text>
  </g>

  <g transform="translate(60, 260)">
    <rect width="220" height="80" rx="12" fill="#0c1220" stroke="#ec4899" stroke-width="1.6"/>
    <rect width="220" height="26" rx="12" fill="url(#hd-pink)"/>
    <rect y="14" width="220" height="12" fill="url(#hd-pink)"/>
    <circle cx="14" cy="13" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="17" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SUBAGENT · Explore</text>
    <text x="110" y="48" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Find auth code</text>
    <text x="110" y="64" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">Haiku · 8K context</text>
  </g>

  <g transform="translate(330, 260)">
    <rect width="220" height="80" rx="12" fill="#0c1220" stroke="#ec4899" stroke-width="1.6"/>
    <rect width="220" height="26" rx="12" fill="url(#hd-pink)"/>
    <rect y="14" width="220" height="12" fill="url(#hd-pink)"/>
    <circle cx="14" cy="13" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="17" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SUBAGENT · routine-worker</text>
    <text x="110" y="48" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Add unit tests</text>
    <text x="110" y="64" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">Sonnet · scoped</text>
  </g>

  <g transform="translate(600, 260)">
    <rect width="220" height="80" rx="12" fill="#0c1220" stroke="#ec4899" stroke-width="1.6"/>
    <rect width="220" height="26" rx="12" fill="url(#hd-pink)"/>
    <rect y="14" width="220" height="12" fill="url(#hd-pink)"/>
    <circle cx="14" cy="13" r="3" fill="#ec4899" filter="url(#glow-pink)"/>
    <text x="26" y="17" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="0.10em">SUBAGENT · Plan</text>
    <text x="110" y="48" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Design migration</text>
    <text x="110" y="64" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">Opus · isolated</text>
  </g>

  <path d="M380,200 L170,260" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-purple)"/>
  <path d="M440,200 L440,260" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-purple)"/>
  <path d="M500,200 L710,260" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-purple)"/>
  <text x="240" y="222" fill="#a855f7" font-size="10" font-style="italic">spawn</text>
  <text x="450" y="222" fill="#a855f7" font-size="10" font-style="italic">spawn</text>
  <text x="640" y="222" fill="#a855f7" font-size="10" font-style="italic">spawn</text>

  <path d="M170,260 L380,210" stroke="#ec4899" stroke-width="1.4" stroke-dasharray="2,3" fill="none" marker-end="url(#arr-pink)" opacity="0.6"/>
  <path d="M440,260 L440,210" stroke="#ec4899" stroke-width="1.4" stroke-dasharray="2,3" fill="none" marker-end="url(#arr-pink)" opacity="0.6"/>
  <path d="M710,260 L500,210" stroke="#ec4899" stroke-width="1.4" stroke-dasharray="2,3" fill="none" marker-end="url(#arr-pink)" opacity="0.6"/>
  <text x="184" y="240" fill="#ec4899" font-size="10" font-style="italic" opacity="0.8">summary</text>
  <text x="416" y="240" fill="#ec4899" font-size="10" font-style="italic" opacity="0.8">summary</text>
  <text x="660" y="240" fill="#ec4899" font-size="10" font-style="italic" opacity="0.8">summary</text>

  <text x="440" y="372" text-anchor="middle" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, monospace" letter-spacing="0.08em">05 / CLAUDE-CODE · SUBAGENT-PATTERN</text>
</svg>
